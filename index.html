
<!doctype html>
<html lang="de">
  <head>
    <!-- ======================================
         BASIC DOCUMENT SETTINGS
    ====================================== -->

    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Theme Color -->
    <meta
      name="theme-color"
      content="#071a33"
    />

    <!-- ======================================
         SEARCH ENGINE OPTIMIZATION (SEO)
    ====================================== -->

    <!-- Page Title -->
    <title>
      Schnell und Sauber | Facility Service Düsseldorf
    </title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Professionelle Reinigung, Entrümpelung, Umzüge und Facility Service in Düsseldorf und Umgebung."
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.schnellundsauber.com/"
    />

    <!-- ======================================
         OPEN GRAPH - SOCIAL MEDIA SHARING
    ====================================== -->

    <!-- Website Type -->
    <meta
      property="og:type"
      content="website"
    />

    <!-- Website Language -->
    <meta
      property="og:locale"
      content="de_DE"
    />

    <!-- Website Title -->
    <meta
      property="og:title"
      content="Schnell und Sauber | Facility Service Düsseldorf"
    />

    <!-- Website Description -->
    <meta
      property="og:description"
      content="Professionelle Reinigung, Entrümpelung, Umzüge und Facility Service in Düsseldorf und Umgebung."
    />

    <!-- Website URL -->
    <meta
      property="og:url"
      content="https://www.schnellundsauber.com/"
    />

    <!-- Social Sharing Image -->
    <meta
      property="og:image"
      content="https://www.schnellundsauber.com/images/brand-logo.png"
    />

    <!-- ======================================
         TWITTER / X CARD METADATA
    ====================================== -->

    <!-- Card Type -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <!-- Card Title -->
    <meta
      name="twitter:title"
      content="Schnell und Sauber | Facility Service Düsseldorf"
    />

    <!-- Card Description -->
    <meta
      name="twitter:description"
      content="Professionelle Reinigung, Entrümpelung, Umzüge und Facility Service in Düsseldorf und Umgebung."
    />

    <!-- Card Image -->
    <meta
      name="twitter:image"
      content="https://www.schnellundsauber.com/images/brand-logo.png"
    />
